[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Order matters: /api/* must be matched before the SPA catch-all below,
# or every function call is served index.html instead.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — one page app, every other path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
